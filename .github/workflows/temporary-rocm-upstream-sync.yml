name: Temporary pinned upstream ROCm sync
on:
  push:
    branches:
      - sync/upstream-rocm-2026-11-15
    paths:
      - .github/workflows/temporary-rocm-upstream-sync.yml

permissions:
  contents: write

jobs:
  merge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Merge upstream ROCm fixes without choosing sides for conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fizgig-upstream-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/shootthesound/Fizgig.git
          git fetch --no-tags upstream a40a60b87bb7ee2366440e9c937c8d93ac3c9c45
          test "$(git rev-parse FETCH_HEAD)" = "a40a60b87bb7ee2366440e9c937c8d93ac3c9c45"
          git merge --no-ff --no-edit -m "Merge upstream ROCm compatibility through a40a60b" FETCH_HEAD
          test -z "$(git ls-files --unmerged)"
          git show -s --pretty="merge %H%nparents %P" HEAD
          git push origin HEAD:refs/heads/sync/upstream-rocm-2026-11-15
      - name: Python and JavaScript parse
        shell: bash
        run: |
          python -m compileall -q src
          for f in src/fizgig/web/static/*.js; do node --check "$f"; done
      - name: Install CPU checks dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r checks/requirements.txt
      - name: Full checks including H3 Image integration
        run: python -m pytest checks -q
      - name: Remove temporary workflow and publish validated result
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/temporary-rocm-upstream-sync.yml
          git commit -m "Remove temporary ROCm upstream merge workflow"
          git push origin HEAD:refs/heads/sync/upstream-rocm-2026-11-15

name: Temporary Fizgig upstream merge
on:
  push:
    branches:
      - sync/upstream-2026-11-15

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Merge the pinned upstream commit with real git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fizgig-upstream-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/shootthesound/Fizgig.git
          git fetch --no-tags upstream b3a892f6f809faa5451dd597e6e2312583c6c781
          test "$(git rev-parse FETCH_HEAD)" = "b3a892f6f809faa5451dd597e6e2312583c6c781"
          git merge --no-ff -X ours --no-edit -m "Merge shootthesound/Fizgig at b3a892f6 into primeinc/Fizgig" FETCH_HEAD
          test -z "$(git ls-files --unmerged)"
          git show -s --pretty="merge %H%nparents %P" HEAD
          git push origin HEAD:refs/heads/sync/upstream-2026-11-15
      - name: Python sources compile
        run: python -m compileall -q src
      - name: JavaScript sources parse
        shell: bash
        run: |
          for f in src/fizgig/web/static/*.js; do node --check "$f"; done
      - name: Install CPU test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r checks/requirements.txt
      - name: Run actual upstream and fork checks
        run: python -m pytest checks -q
      - name: Remove temporary merge workflow and publish validated merge
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/temporary-upstream-merge.yml
          git commit -m "Remove temporary upstream merge workflow"
          git push origin HEAD:refs/heads/sync/upstream-2026-11-15
